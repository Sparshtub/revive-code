services:
  - type: web
    name: revivecode-backend
    env: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python -c "from transformers import AutoTokenizer, AutoModelForMaskedLM; AutoTokenizer.from_pretrained('microsoft/codebert-base-mlm'); AutoModelForMaskedLM.from_pretrained('microsoft/codebert-base-mlm')"
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: revivecode-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false

databases:
  - name: revivecode-db
    plan: free
